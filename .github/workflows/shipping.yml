# Keeps the "Recently shipped" list in README.md in step with the latest releases.
# Commits only when a new release appears, so it never adds fake daily activity.
name: Shipping log

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild the card
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/shipping.py

      - name: Commit if something new shipped
        run: |
          if git diff --quiet; then echo "Nothing new."; exit 0; fi
          git config user.name "itsnotsimple"
          git config user.email "99130321+itsnotsimple@users.noreply.github.com"
          git add README.md img/shipping.svg
          git commit -m "Shipping log: new release"
          git push
